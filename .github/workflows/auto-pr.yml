name: Auto PR

on:
  push:
    branches-ignore:
      - main
      - nonprod
      - dependabot/**

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    name: Open PR against nonprod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create draft PR if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          existing="$(gh pr list --head "${GITHUB_REPOSITORY_OWNER}:${branch}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Open PR already exists: #${existing}"
            exit 0
          fi

          git fetch origin nonprod

          if git merge-base --is-ancestor HEAD origin/nonprod; then
            echo "Branch has no commits ahead of nonprod; skipping."
            exit 0
          fi

          gh pr create \
            --base nonprod \
            --head "$branch" \
            --draft \
            --fill
