# Postgres do perfil local. Credenciais vêm do `.env` (veja `.env.example`).
# Não use este Compose no Railway: preprod e prod têm o Postgres do próprio environment.
services:
  postgres:
    image: postgres:16
    container_name: domus-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-domus}
      POSTGRES_USER: ${POSTGRES_USER:-domus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env (veja .env.example)}
    volumes:
      - domus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  domus-postgres-data:
